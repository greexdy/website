<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Contact Information</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
    <style>
        body {
            font-family: 'Roboto', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-50">
    <header class="flex justify-between items-center p-6 bg-white shadow-md">
        <div class="text-2xl font-bold text-purple-600">brecht.</div>
        <nav class="space-x-6">
            <a class="text-gray-700 hover:text-purple-600" href="index.html">Home</a>
            <a class="text-gray-700 hover:text-purple-600" href="#">About</a>
            <a class="text-gray-700 hover:text-purple-600" href="accomplishments.html">Portfolio</a>
            <a class="text-gray-700 hover:text-purple-600" href="#">Blog</a>
            <a class="text-gray-700 hover:text-purple-600" href="#">Contact</a>
    </header>
    <main class="flex flex-col items-center justify-center p-6 lg:p-24">
        <div class="w-full max-w-lg bg-white p-8 rounded-lg shadow-lg">
            <h2 class="text-3xl font-bold text-gray-800 mb-6">My Contact Information</h2>
            <form class="space-y-6">
                <div>
                    <label class="block text-gray-700 font-medium mb-2" for="name">Name</label>
                    <input class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-purple-600" id="name" name="name" type="text" value="Brecht Bondue" readonly/>
                </div>
                <div>
                    <label class="block text-gray-700 font-medium mb-2" for="email">Email</label>
                    <input class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-purple-600" id="email" name="email" type="email" value="bondue.brecht@gmail.com" readonly/>
                </div>
                <div>
                    <label class="block text-gray-700 font-medium mb-2" for="phone">Phone</label>
                    <input class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-purple-600" id="phone" name="phone" type="text" value="+1234567890" readonly/>
                </div>
                <div>
                    <label class="block text-gray-700 font-medium mb-2" for="address">Address</label>
                    <input class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-purple-600" id="address" name="address" type="text" value="123 Main St, Anytown, USA" readonly/>
                </div>
                <div>
                    <label class="block text-gray-700 font-medium mb-2" for="linkedin">LinkedIn</label>
                    <input class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-purple-600" id="linkedin" name="linkedin" type="text" value="linkedin.com/in/joegreyson" readonly/>
                </div>
                <div>
                    <label class="block text-gray-700 font-medium mb-2" for="github">GitHub</label>
                    <input class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-purple-600" id="github" name="github" type="text" value="github.com/joegreyson" readonly/>
                </div>
            </form>
        </div>
    </main>
</body>
</html>

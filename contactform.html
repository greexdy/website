    <main class="flex flex-col items-center justify-center p-6 lg:p-24">
        <div class="w-full max-w-lg bg-white p-8 rounded-lg shadow-lg">
            <h2 class="text-3xl font-bold text-gray-800 mb-6">My Contact Information</h2>
            <form class="space-y-6">
                <div>
                    <label class="block text-gray-700 font-medium mb-2" for="name">Name</label>
                    <input class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-green-600" id="name" name="name" type="text" value="Brecht Bondue" readonly/>
                </div>
                <div>
                    <label class="block text-gray-700 font-medium mb-2" for="email">Email</label>
                    <input class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-green-600" id="email" name="email" type="email" value="brecht@bondue.net" readonly/>
                </div>
                <div>
                    <label class="block text-gray-700 font-medium mb-2" for="phone">Phone</label>
                    <input class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-green-600" id="phone" name="phone" type="text" value="+1234567890" readonly/>
                </div>
                <div>
                    <label class="block text-gray-700 font-medium mb-2" for="linkedin">LinkedIn</label>
                    <input class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-green-600" id="linkedin" name="linkedin" type="text" value="linkedin.com/in/joegreyson" readonly/>
                </div>
                <div>
                    <label class="block text-gray-700 font-medium mb-2" for="github">GitHub</label>
                    <input class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-green-600" id="github" name="github" type="text" value="github.com/greexdy" readonly/>
                </div>
            </form>
        </div>
        <script>
            const menuBtn = document.getElementById('menu-btn');
            const menu = document.getElementById('menu');
            const mobileMenu = document.getElementById('mobile-menu');
